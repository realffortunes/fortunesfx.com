<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" fill="none" role="img" aria-label="Isometric laptop showing a rising candlestick chart with gold coins">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3C14B"/><stop offset="1" stop-color="#C98F12"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B1B1B"/><stop offset="1" stop-color="#0E0E0E"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F3C14B" stop-opacity="0"/><stop offset=".5" stop-color="#F3C14B" stop-opacity=".35"/><stop offset="1" stop-color="#F3C14B" stop-opacity="0"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <!-- ground shadow -->
  <ellipse cx="320" cy="430" rx="250" ry="42" fill="#C98F12" opacity=".14" filter="url(#soft)"/>
  <!-- grid lines (isometric floor) -->
  <g stroke="#D9A520" stroke-opacity=".18" stroke-width="1.5">
    <path d="M60 390 L330 250"/><path d="M130 430 L400 290"/><path d="M200 470 L470 330"/>
    <path d="M330 250 L600 390"/><path d="M260 290 L530 430"/><path d="M190 330 L460 470"/>
  </g>
  <!-- laptop base (parallelogram) -->
  <path d="M120 372 L370 240 L560 342 L310 474 Z" fill="#F4EFE4" stroke="#E3D8C2" stroke-width="2"/>
  <path d="M310 474 L560 342 L560 356 L310 488 Z" fill="#E6DCC6"/>
  <path d="M120 372 L310 474 L310 488 L120 386 Z" fill="#D9CDB3"/>
  <!-- keyboard -->
  <g fill="#DED3BA">
    <path d="M190 372 L350 288 L470 352 L310 436 Z"/>
  </g>
  <g stroke="#F4EFE4" stroke-width="2" stroke-opacity=".9">
    <path d="M210 378 L370 294"/><path d="M232 390 L392 306"/><path d="M254 402 L414 318"/><path d="M276 414 L436 330"/><path d="M298 426 L458 342"/>
  </g>
  <!-- trackpad -->
  <path d="M330 440 L390 408 L430 430 L370 462 Z" fill="#EFE7D6"/>
  <!-- screen body -->
  <path d="M170 110 L372 212 L372 420 L170 318 Z" fill="#111" />
  <path d="M184 128 L358 216 L358 400 L184 312 Z" fill="url(#screen)"/>
  <!-- screen glow -->
  <path d="M184 128 L358 216 L358 400 L184 312 Z" fill="url(#glow)" opacity=".5"/>
  <!-- chart grid on screen -->
  <g stroke="#2A2A2A" stroke-width="1">
    <path d="M196 170 L346 246"/><path d="M196 210 L346 286"/><path d="M196 250 L346 326"/><path d="M196 290 L346 366"/>
  </g>
  <!-- candlesticks (skewed to screen plane): green up, red down -->
  <g transform="matrix(1 0.505 0 1 0 22)">
    <g stroke-width="2">
      <path d="M212 200 v46" stroke="#2BB673"/><path d="M234 186 v56" stroke="#E5484D"/><path d="M256 170 v50" stroke="#2BB673"/>
      <path d="M278 150 v56" stroke="#2BB673"/><path d="M300 128 v52" stroke="#E5484D"/><path d="M322 100 v60" stroke="#2BB673"/>
    </g>
    <g>
      <rect x="206" y="212" width="12" height="22" fill="#2BB673"/>
      <rect x="228" y="196" width="12" height="30" fill="#E5484D"/>
      <rect x="250" y="180" width="12" height="26" fill="#2BB673"/>
      <rect x="272" y="160" width="12" height="32" fill="#2BB673"/>
      <rect x="294" y="140" width="12" height="24" fill="#E5484D"/>
      <rect x="316" y="110" width="12" height="36" fill="#2BB673"/>
    </g>
    <path d="M206 236 C240 226, 260 210, 290 170 S320 120, 336 104" stroke="#7CE0A8" stroke-opacity=".8" stroke-width="2" stroke-dasharray="4 5"/>
  </g>
  <!-- coins -->
  <g>
    <ellipse cx="566" cy="196" rx="34" ry="34" fill="url(#gold)"/>
    <ellipse cx="566" cy="196" rx="24" ry="24" fill="none" stroke="#FFF" stroke-opacity=".55" stroke-width="2"/>
    <text x="566" y="207" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#5B3F05">$</text>
    <ellipse cx="96" cy="212" rx="26" ry="26" fill="url(#gold)"/>
    <ellipse cx="96" cy="212" rx="18" ry="18" fill="none" stroke="#FFF" stroke-opacity=".55" stroke-width="2"/>
    <text x="96" y="221" text-anchor="middle" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#5B3F05">$</text>
    <ellipse cx="520" cy="130" rx="16" ry="16" fill="url(#gold)" opacity=".9"/>
  </g>
  <!-- floating tiles -->
  <g fill="#FFFFFF" stroke="#E3D8C2" stroke-width="1.5">
    <path d="M40 300 L96 270 L152 300 L96 330 Z"/>
    <path d="M500 420 L556 390 L612 420 L556 450 Z"/>
  </g>
  <g stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M78 302 L92 294 L104 302 L118 290" stroke="#2BB673"/>
    <path d="M538 422 L552 414 L564 422 L578 410" stroke="#E5484D"/>
  </g>

</svg>
