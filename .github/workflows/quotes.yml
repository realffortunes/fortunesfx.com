name: Refresh index quotes
on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may run a few minutes late)
  workflow_dispatch:         # manual run button in the Actions tab
permissions:
  contents: write
jobs:
  quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_quotes.py
      - name: Commit if changed
        run: |
          git config user.name "quotes-bot"
          git config user.email "quotes-bot@users.noreply.github.com"
          git add data/quotes.json
          git diff --cached --quiet || git commit -m "quotes: $(date -u +%Y-%m-%dT%H:%MZ)" && git push
